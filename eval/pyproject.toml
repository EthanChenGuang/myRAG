[project]
name = "rag-eval"
version = "0.1.0"
description = "myRAG evaluation harness: span matching, golden-set split, metrics, gate"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.4",
    "rag-sidecar",
]

[project.optional-dependencies]
judge = [
    "deepeval==4.3.4",
    "ragas==0.4.4",
]
draft = [
    "anthropic==2.12.0",
    "ragas==0.4.4",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv.sources]
rag-sidecar = { path = "../rag-sidecar", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
