[project]
name = "rag-sidecar"
version = "0.1.0"
description = "myRAG Python sidecar: contracts and services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic>=2.14.4",
    "python-multipart==0.0.34",
    "python-stdnum==2.2",
]

[project.optional-dependencies]
chunking = ["docling-core[chunking-openai]==2.107.1", "huggingface_hub==1.33.0", "tiktoken==0.14.0"]
preflight = ["pypdfium2==5.15.2", "pdfplumber==0.11.11"]
docling = [
  "docling[rapidocr]==2.150.1", "docling-core[chunking-openai]==2.107.1",
  "tiktoken==0.14.0", "pypdfium2==5.15.2", "pdfplumber==0.11.11",
  "torch==2.15.0", "torchvision==0.29.2",
]
ray = ["ray[data]==2.60.1"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
exclude-newer = "2026-11-25T00:00:00Z"
exclude-newer-package = { fastapi = "2026-11-25T00:00:00Z", pydantic = "2026-11-25T00:00:00Z", pydantic-core = "2026-11-25T00:00:00Z", annotated-doc = "2026-11-25T00:00:00Z", certifi = "2026-11-25T00:00:00Z", torch = false, torchvision = false, pdfplumber = "2026-11-25T00:00:00Z", "pdfminer-six" = "2026-11-25T00:00:00Z", ray = "2026-11-25T00:00:00Z" }
constraint-dependencies = ["rapidocr==3.10.0", "onnxruntime==1.32.0", "docling-slim==2.150.1", "transformers==5.23.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_docling: runs a real Docling conversion; needs the docling extra and baked models"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
