name: promote-production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit sha whose staged production deployment to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Promote the staged production deployment only after a passed rag-release-gate
        env:
          PROMOTE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node scripts/ci/promote-production.mjs --sha "$PROMOTE_SHA"
