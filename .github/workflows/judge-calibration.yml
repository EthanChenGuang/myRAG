name: judge-calibration

on:
  schedule:
    - cron: '41 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judge-calibration
  cancel-in-progress: false

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: '1'
  DEEPEVAL_UPDATE_WARNING_OPT_IN: '0'
  RAGAS_DO_NOT_TRACK: 'true'

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_JUDGE_KEYS: ${{ secrets.OPENROUTER_API_KEY != '' && (secrets.OPENAI_API_KEY != '' || vars.RAG_EVAL_OPENAI_VIA != 'openai') && vars.RAG_JUDGE_GENERATOR_MODEL != '' }}
      RAG_EVAL_OPENAI_VIA: ${{ vars.RAG_EVAL_OPENAI_VIA || (secrets.OPENAI_API_KEY == '' && 'openrouter' || 'openai') }}
      HAS_REVIEW_QUEUE: ${{ secrets.RAG_ADMIN_BEARER != '' && secrets.RAG_APP_URL != '' && secrets.RAG_JUDGE_CALIBRATION_TENANT != '' }}
    steps:
      - name: Skip notice when judge keys or the generator model are absent
        if: env.HAS_JUDGE_KEYS != 'true'
        run: echo "::notice::judge keys or generator model not configured, skipping judge calibration"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_JUDGE_KEYS == 'true'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: env.HAS_JUDGE_KEYS == 'true'
        with:
          version: '0.11.32'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Sync eval project
        if: env.HAS_JUDGE_KEYS == 'true'
        run: uv sync --directory eval --locked --all-extras
      - name: Sync rag-sidecar project
        if: env.HAS_JUDGE_KEYS == 'true'
        run: uv sync --directory rag-sidecar --locked
      - name: Seed-set calibration (numbers and codes only)
        if: env.HAS_JUDGE_KEYS == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAG_JUDGE_GENERATOR_MODEL: ${{ vars.RAG_JUDGE_GENERATOR_MODEL }}
        run: >-
          uv run --directory eval python -m rag_eval.judge_calibration run --seed-only
          --generator-model "$RAG_JUDGE_GENERATOR_MODEL"
          --write --out eval/out/judge-calibration
      - name: Review-queue calibration (report stays under eval/golden/private, only the cells reach the file)
        if: env.HAS_JUDGE_KEYS == 'true' && env.HAS_REVIEW_QUEUE == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAG_JUDGE_GENERATOR_MODEL: ${{ vars.RAG_JUDGE_GENERATOR_MODEL }}
          RAG_ADMIN_BEARER: ${{ secrets.RAG_ADMIN_BEARER }}
          RAG_APP_URL: ${{ secrets.RAG_APP_URL }}
          RAG_JUDGE_CALIBRATION_TENANT: ${{ secrets.RAG_JUDGE_CALIBRATION_TENANT }}
        run: >-
          uv run --directory eval python -m rag_eval.judge_calibration run
          --tenant "$RAG_JUDGE_CALIBRATION_TENANT" --base-url "$RAG_APP_URL"
          --generator-model "$RAG_JUDGE_GENERATOR_MODEL" --write
      - name: Upload the calibration file and the seed report for a person to open the pull request
        if: always() && env.HAS_JUDGE_KEYS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: judge-calibration
          path: |
            eval/config/judge-calibration.json
            eval/out/judge-calibration
          if-no-files-found: warn
